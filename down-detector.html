<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <title>Detector · Community Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --paper:#080808; --ink:#f2f2ef; --muted:#989894; --line:#282826; --line-strong:#494946; --panel:#121212; --soft:#1d1d1b; --danger:#d45d5d; --success:#6fc18f; color-scheme:dark; }
      * { box-sizing:border-box; } body { margin:0; min-width:320px; background:var(--paper); color:var(--ink); font-family:Inter,system-ui,sans-serif; } button,input { font:inherit; } a { color:inherit; } .mono { font-family:"DM Mono",monospace; } .shell { width:min(100% - 40px,1180px); margin:0 auto; }
      .site-header { border-bottom:1px solid var(--line); background:rgba(8,8,8,.92); backdrop-filter:blur(14px); position:sticky; top:0; z-index:20; } .header-row { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:24px; } .brand { display:inline-flex; align-items:baseline; font-weight:800; letter-spacing:-.04em; } .brand-sub { color:var(--muted); font-size:11px; font-weight:500; letter-spacing:0; } .brand-link { color:inherit; text-decoration:underline; text-underline-offset:3px; } .header-actions { display:flex; align-items:center; gap:8px; }
      .text-btn,.icon-btn { border:1px solid transparent; background:transparent; color:var(--muted); cursor:pointer; border-radius:9px; padding:8px 10px; text-decoration:none; } .text-btn:hover,.icon-btn:hover { color:var(--ink); background:var(--soft); border-color:var(--line); }
      .menu-wrap { position:relative; } .menu-button { font-size:19px; line-height:1; } .site-menu { position:absolute; top:calc(100% + 10px); right:0; width:220px; padding:6px; background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; box-shadow:0 18px 40px rgba(0,0,0,.35); } .site-menu.hidden { display:none; } .site-menu a { display:block; padding:10px; border-radius:7px; font-size:12px; text-decoration:none; } .site-menu a:hover,.site-menu a.active { background:var(--soft); }
      main { padding:42px 0 72px; } .test-form { display:grid; grid-template-columns:1fr auto auto; gap:10px; max-width:820px; } .test-form input { min-width:0; height:46px; border:1px solid var(--line-strong); border-radius:9px; background:var(--panel); color:var(--ink); padding:0 14px; outline:none; } .test-form input:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(242,242,239,.12); } .run-btn,.secondary-btn { height:46px; border-radius:9px; padding:0 17px; cursor:pointer; font-size:12px; font-weight:700; } .run-btn { border:1px solid var(--ink); background:var(--ink); color:var(--paper); } .run-btn:hover { background:#d7d7d3; } .run-btn:disabled { cursor:wait; opacity:.55; } .secondary-btn { border:1px solid var(--line-strong); background:transparent; color:var(--muted); } .secondary-btn:hover { color:var(--ink); background:var(--soft); }
      .picker { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:28px; } .category { background:var(--panel); border:1px solid var(--line); border-radius:11px; overflow:hidden; } .category-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 14px; border-bottom:1px solid var(--line); font-size:12px; font-weight:700; } .category.collapsed .category-head { border-bottom:0; } .category-title { min-width:0; } .category-count { margin-left:auto; color:var(--muted); font-size:10px; font-weight:500; } .category-collapse { width:24px; height:24px; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; line-height:1; } .category-collapse:hover { color:var(--ink); background:var(--soft); } .extensions { padding:6px; max-height:270px; overflow:auto; } .category.collapsed .extensions { display:none; } .extension { display:flex; align-items:center; gap:9px; padding:8px; border-radius:7px; cursor:pointer; } .extension:hover { background:var(--soft); } .extension-icon { width:26px; height:26px; flex:0 0 26px; border:1px solid var(--line); border-radius:6px; object-fit:cover; background:var(--soft); } .extension-info { min-width:0; } .extension-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; } .extension-meta { display:block; margin-top:2px; color:var(--muted); font-size:9px; }
      .summary { display:flex; justify-content:space-between; gap:16px; align-items:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-top:34px; padding:16px 0; color:var(--muted); font-size:12px; } .summary strong { color:var(--ink); } .ignored-section { margin-top:24px; color:var(--muted); } .ignored-section summary { width:max-content; max-width:100%; cursor:pointer; opacity:.62; font-size:11px; } .ignored-section summary:hover { opacity:1; } .ignored-list { display:grid; gap:7px; margin-top:10px; max-width:820px; } .ignored-item { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:rgba(18,18,18,.55); font-size:11px; } .ignored-item input { margin-top:3px; accent-color:var(--ink); } .ignored-copy { min-width:0; } .ignored-item strong { display:block; color:var(--ink); font-size:12px; } .ignored-item span { display:block; margin-top:3px; } .ignored-empty { font-size:11px; } .results { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding-top:14px; } .result { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:15px; } .result-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; } .result h2 { margin:0; font-size:14px; } .result-icon { width:32px; height:32px; flex:0 0 32px; border:1px solid var(--line); border-radius:7px; object-fit:cover; background:var(--soft); } .result-id { margin-top:3px; color:var(--muted); font-size:10px; } .status { border-radius:999px; padding:3px 7px; font-size:10px; font-weight:700; text-transform:uppercase; } .status.up { color:var(--success); border:1px solid rgba(111,193,143,.35); } .status.down,.status.timeout { color:var(--danger); border:1px solid rgba(212,93,93,.35); } .status.warning { color:#d5b870; border:1px solid rgba(213,184,112,.35); } .status.unsupported { color:#b8a4d9; border:1px solid rgba(184,164,217,.35); } .status.ignored { color:#d5b870; border:1px solid rgba(213,184,112,.35); } .result-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; } .chip { color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 7px; font-size:10px; } .checks { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:14px; } .check { display:flex; justify-content:space-between; gap:6px; padding:7px 8px; border:1px solid var(--line); border-radius:7px; font-size:10px; } .check-label { color:var(--muted); } .check-status { font-weight:700; text-transform:lowercase; } .check-status.success { color:var(--success); } .check-status.fail { color:var(--danger); } .check-status.warning { color:#d5b870; } .result-message { min-height:32px; margin:13px 0 0; color:var(--muted); font-size:11px; } .empty { grid-column:1/-1; border:1px dashed var(--line-strong); border-radius:11px; padding:58px 20px; text-align:center; color:var(--muted); font-size:13px; } footer { border-top:1px solid var(--line); color:var(--muted); padding:22px 0 34px; font-size:12px; }
      @media (max-width:800px) { .picker { grid-template-columns:1fr 1fr; } .results { grid-template-columns:repeat(2,minmax(0,1fr)); } } @media (max-width:560px) { .shell { width:min(100% - 28px,1180px); } .brand-sub { font-size:10px; } .header-row { min-height:62px; } .text-btn { display:none; } .test-form { grid-template-columns:1fr; } .run-btn,.secondary-btn { width:100%; } .picker,.results { grid-template-columns:1fr; } .summary { align-items:flex-start; flex-direction:column; } }
    </style>
  </head>
  <body>
    <header class="site-header"><div class="shell header-row"><div class="brand">Community Marketplace <span class="brand-sub">(managed by <a class="brand-link" href="https://github.com/Pal-droid" target="_blank" rel="noopener">@Pal-droid</a>)</span></div><div class="header-actions"><a class="text-btn" href="./">Marketplace</a><div class="menu-wrap"><button class="icon-btn menu-button" id="menu-button" type="button" aria-label="Open menu" aria-expanded="false">☰</button><nav class="site-menu hidden" id="site-menu"><a href="./">Marketplace</a><a class="active" href="./down-detector.html">Extensions down detector</a></nav></div></div></div></header>
    <main class="shell"><form class="test-form" id="test-form"><input id="query" type="search" value="One Piece" maxlength="80" placeholder="Search query" aria-label="Search query" /><button class="run-btn" id="run-button" type="submit">Run test</button><button class="secondary-btn" id="deselect-button" type="button">Deselect all</button></form><section class="picker" id="picker" aria-label="Choose extensions"><div class="empty">Loading extensions…</div></section><details class="ignored-section" id="ignored-section"><summary>Ignored extensions and skip controls</summary><div class="ignored-list" id="ignored-list"></div></details><div class="summary"><span id="summary-text"><strong>0</strong>/15 selected</span><span class="mono" id="last-run"></span></div><section class="results" id="results" aria-live="polite"><div class="empty">Choose extensions and run a test.</div></section></main>
    <footer><div class="shell">Community Marketplace · Content provider checks</div></footer>
    <script>
      const $ = selector => document.querySelector(selector);
      const API_URL = window.location.hostname.endsWith("github.io") ? "https://seanime-providers.vercel.app/api/check" : "/api/check";
      const CATEGORIES = [{ type:"onlinestream-provider", label:"Online streaming" }, { type:"manga-provider", label:"Manga" }, { type:"anime-torrent-provider", label:"Torrents" }];
      const ICON_FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='#1d1d1b'/><path d='M32 20v24M20 32h24' stroke='#494946' stroke-width='3'/></svg>");
      function iconFor(item) { return item.icon || ICON_FALLBACK; }
      const state = { items:[], selected:new Set(), collapsed:new Set(), ignoreChecks:new Map() };
      function ignoreEntry(id) { return state.ignoreChecks.get(String(id)); }
      function isIgnored(id) { return ignoreEntry(id)?.enabled === true; }
      const menuButton = $("#menu-button"); const menu = $("#site-menu");
      menuButton.addEventListener("click", () => { const hidden = menu.classList.toggle("hidden"); menuButton.setAttribute("aria-expanded", String(!hidden)); });
      document.addEventListener("click", event => { if (!event.target.closest(".menu-wrap")) { menu.classList.add("hidden"); menuButton.setAttribute("aria-expanded", "false"); } });
      function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" })[char]); }
      function updateSelectedCount() { $("#summary-text").innerHTML = `<strong>${state.selected.size}</strong>/15 selected`; $("#run-button").disabled = !state.selected.size; }
      function updateCategoryCounts() { document.querySelectorAll(".category-count").forEach(count => { const type = count.dataset.type; const total = state.items.filter(item => item.type === type && !isIgnored(item.id)).length; const selected = state.items.filter(item => item.type === type && !isIgnored(item.id) && state.selected.has(item.id)).length; count.textContent = `${selected}/${total}`; }); }
      function renderIgnoredList() { const list = $("#ignored-list"); if (!state.ignoreChecks.size) { list.innerHTML = '<p class="ignored-empty">No extensions are configured to be ignored.</p>'; return; } list.innerHTML = [...state.ignoreChecks].map(([id, entry]) => { const item = state.items.find(candidate => String(candidate.id) === id) || { id, name:id }; return `<label class="ignored-item"><input type="checkbox" class="ignore-toggle" data-id="${escapeHtml(id)}" ${entry.enabled ? "checked" : ""} /><span class="ignored-copy"><strong>${escapeHtml(item.name || id)}</strong><span class="mono">${escapeHtml(id)}</span><span>${escapeHtml(entry.reason)}</span></span></label>`; }).join(""); document.querySelectorAll(".ignore-toggle").forEach(toggle => toggle.addEventListener("change", event => { const id = event.target.dataset.id; const entry = ignoreEntry(id); if (!entry) return; entry.enabled = event.target.checked; if (entry.enabled) state.selected.delete(id); renderPicker(); renderIgnoredList(); })); }
      function renderPicker() {
        $("#picker").innerHTML = CATEGORIES.map(category => { const items = state.items.filter(item => item.type === category.type && !isIgnored(item.id)); const collapsed = state.collapsed.has(category.type); return `<section class="category${collapsed ? " collapsed" : ""}" data-type="${category.type}"><div class="category-head"><strong class="category-title">${category.label}</strong><span class="category-count" data-type="${category.type}">0/${items.length}</span><button type="button" class="category-collapse" data-type="${category.type}" aria-expanded="${!collapsed}" aria-label="${collapsed ? "Expand" : "Collapse"} ${category.label}">${collapsed ? "⌄" : "⌃"}</button></div><div class="extensions">${items.map(item => `<label class="extension"><input type="checkbox" class="extension-toggle" data-id="${escapeHtml(item.id)}" ${state.selected.has(item.id) ? "checked" : ""} /><img class="extension-icon" src="${escapeHtml(iconFor(item))}" alt="" loading="lazy" /><span class="extension-info"><span class="extension-name">${escapeHtml(item.name || item.id)}</span><span class="extension-meta">${escapeHtml(item.author || "Unknown")} · v${escapeHtml(item.version || "—")}</span></span></label>`).join("")}</div></section>`; }).join("");
        document.querySelectorAll(".extension-toggle").forEach(toggle => toggle.addEventListener("change", event => { if (event.target.checked && state.selected.size >= 15) { event.target.checked = false; return; } event.target.checked ? state.selected.add(event.target.dataset.id) : state.selected.delete(event.target.dataset.id); updateSelectedCount(); updateCategoryCounts(); }));
        document.querySelectorAll(".category-collapse").forEach(button => button.addEventListener("click", event => { const type = event.currentTarget.dataset.type; const category = event.currentTarget.closest(".category"); const collapsed = category.classList.toggle("collapsed"); state.collapsed[collapsed ? "add" : "delete"](type); event.currentTarget.textContent = collapsed ? "⌄" : "⌃"; event.currentTarget.setAttribute("aria-expanded", String(!collapsed)); event.currentTarget.setAttribute("aria-label", `${collapsed ? "Expand" : "Collapse"} ${CATEGORIES.find(item => item.type === type)?.label || type}`); }));
        updateCategoryCounts();
        updateSelectedCount();
      }
      function renderCheck(checks, key, label) { const check = checks?.[key] || { status:"fail" }; const state = check.status === "success" ? "success" : check.status === "warning" ? "warning" : check.status === "ignored" ? "ignored" : "fail"; return `<div class="check"><span class="check-label">${label}</span><span class="check-status ${state}">${state === "success" ? "succeed" : state === "warning" ? "warning" : state === "ignored" ? "ignored" : "fail"}</span></div>`; }
      $("#deselect-button").addEventListener("click", () => { state.selected.clear(); document.querySelectorAll(".extension-toggle").forEach(toggle => { toggle.checked = false; }); updateCategoryCounts(); updateSelectedCount(); });
      function renderResults(data) {
        const results = $("#results"); const items = Array.isArray(data.results) ? data.results : []; const summary = data.summary || {};
        $("#summary-text").innerHTML = `<strong>${items.length}</strong> tested · <strong>${summary.up || 0}</strong> operational · <strong>${summary.warning || 0}</strong> warnings · <strong>${(summary.down || 0) + (summary.timeout || 0)}</strong> failed`;
        $("#last-run").textContent = `${data.query} · ${new Date(data.checkedAt).toLocaleTimeString()}`; results.innerHTML = "";
        if (!items.length) { results.innerHTML = '<div class="empty">No provider results returned.</div>'; return; }
        items.forEach(item => { const card = document.createElement("article"); card.className = "result"; card.innerHTML = `<div class="result-head"><div style="display:flex;align-items:center;gap:10px"><img class="result-icon" src="${escapeHtml(iconFor(item))}" alt="" loading="lazy" /><div><h2>${escapeHtml(item.name)}</h2><div class="result-id mono">${escapeHtml(item.id)}</div></div></div><span class="status ${escapeHtml(item.status)}">${escapeHtml(item.status)}</span></div><div class="result-meta"><span class="chip">${escapeHtml(item.type)}</span><span class="chip">v${escapeHtml(item.version || "—")}</span><span class="chip">${escapeHtml(item.durationMs)} ms</span>${item.entries ? `<span class="chip">${escapeHtml(item.entries)} entries</span>` : ""}</div><div class="checks">${renderCheck(item.checks, "search", "Search")}${renderCheck(item.checks, "entries", item.type === "Manga" ? "Chapters" : "Episodes")}${renderCheck(item.checks, "stream", item.type === "Manga" ? "Pages" : "Stream")}</div><p class="result-message">${escapeHtml(item.message)}</p></div>`; card.querySelectorAll("img").forEach(image => image.addEventListener("error", () => { image.src = ICON_FALLBACK; })); results.appendChild(card); });
      }
      async function loadExtensions() { try { const [response, ignoreResponse] = await Promise.all([fetch("marketplace/main.json"), fetch("marketplace/ignore-check.json")]); if (!response.ok) throw new Error(); const catalog = await response.json(); const ignoreConfig = ignoreResponse.ok ? await ignoreResponse.json() : []; const ignoreAll = Array.isArray(ignoreConfig) || ignoreConfig?.ignoreAll === true; const ignoreEntries = Array.isArray(ignoreConfig) ? ignoreConfig : ignoreConfig?.extensions || []; state.ignoreChecks = new Map(ignoreEntries.filter(entry => entry?.id && entry?.reason).map(entry => [String(entry.id), { reason:String(entry.reason), enabled:ignoreAll || entry.ignore === true }])); const contentItems = catalog.filter(item => CATEGORIES.some(category => category.type === item.type)); state.items = await Promise.all(contentItems.map(async item => { try { const manifestResponse = await fetch(item.manifestURI); const manifest = manifestResponse.ok ? await manifestResponse.json() : {}; return { ...item, ...manifest }; } catch { return item; } })); state.selected.clear(); renderPicker(); renderIgnoredList(); } catch { $("#picker").innerHTML = '<div class="empty">Could not load extensions.</div>'; } }
      $("#test-form").addEventListener("submit", async event => { event.preventDefault(); const query = $("#query").value.trim() || "One Piece"; const ids = [...state.selected]; if (!ids.length) return; const button = $("#run-button"); button.disabled = true; button.textContent = "Testing…"; $("#last-run").textContent = ""; $("#results").innerHTML = '<div class="empty">Running selected checks…</div>'; try { const response = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ query, ids, ignoreIds:[...state.ignoreChecks].filter(([, entry]) => entry.enabled).map(([id]) => id) }) }); const data = await response.json(); if (!response.ok) throw new Error(data.error || "Detector unavailable"); renderResults(data); } catch (error) { $("#summary-text").textContent = error.message; $("#results").innerHTML = '<div class="empty">The detector backend is unavailable.</div>'; } finally { button.disabled = !state.selected.size; button.textContent = "Run test"; } });
      loadExtensions();
    </script>
  </body>
</html>
