<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="A minimal marketplace for Seanime extensions, providers, and plugins." />
    <title>Community Marketplace (managed by @Pal-droid)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #080808;
        --ink: #f2f2ef;
        --muted: #989894;
        --line: #282826;
        --line-strong: #494946;
        --panel: #121212;
        --soft: #1d1d1b;
        --accent: #f2f2ef;
        --danger: #d45d5d;
        --success: #6fc18f;
        --radius: 14px;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
        line-height: 1.5;
      }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      a { color: inherit; }
      .mono { font-family: "DM Mono", ui-monospace, SFMono-Regular, monospace; }
      .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
      .site-header { border-bottom: 1px solid var(--line); background: rgba(8, 8, 8, .92); backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 20; }
      .header-row { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .brand { display: inline-flex; align-items: baseline; text-decoration: none; font-weight: 800; letter-spacing: -.04em; }
      .brand-sub { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0; }
      .brand-link { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
      .brand-link:hover { color: var(--ink); }
      .header-actions { display: flex; align-items: center; gap: 8px; }
      .menu-wrap { position: relative; }
      .menu-button { font-size: 19px; line-height: 1; }
      .site-menu { position: absolute; top: calc(100% + 10px); right: 0; width: 220px; padding: 6px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 18px 40px rgba(0, 0, 0, .35); }
      .site-menu.hidden { display: none; }
      .site-menu a { display: block; padding: 10px; border-radius: 7px; color: var(--ink); font-size: 12px; text-decoration: none; }
      .site-menu a:hover, .site-menu a.active { background: var(--soft); }
      .icon-btn, .text-btn { border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; border-radius: 9px; padding: 8px 10px; transition: .18s ease; }
      .icon-btn:hover, .text-btn:hover { color: var(--ink); background: var(--soft); border-color: var(--line); }
      .hero { padding: 72px 0 44px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr); gap: 48px; align-items: end; }
      .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; }
      .eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--ink); }
      h1 { max-width: 720px; margin: 17px 0 16px; font-size: clamp(2.45rem, 6vw, 5.6rem); line-height: .98; letter-spacing: -.075em; font-weight: 800; }
      .hero-copy { max-width: 560px; color: var(--muted); font-size: 16px; }
      .hero-note { border-top: 1px solid var(--ink); padding-top: 14px; color: var(--muted); font-size: 13px; }
      .hero-note strong { color: var(--ink); display: block; margin-bottom: 4px; }
      .toolbar { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 0; }
      .search-row { display: grid; grid-template-columns: minmax(220px, 1fr) 190px 190px auto; gap: 10px; }
      .field { position: relative; }
      .field input, .field select { width: 100%; height: 44px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel); color: var(--ink); padding: 0 13px; outline: none; transition: .18s ease; }
      .field input { padding-left: 40px; }
      .field input:focus, .field select:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(242, 242, 239, .12); }
      .search-icon { position: absolute; left: 14px; top: 13px; color: var(--muted); pointer-events: none; }
      .clear-btn { height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
      .clear-btn:hover { color: var(--ink); background: var(--soft); }
      .tabs { display: flex; gap: 8px; overflow-x: auto; padding-top: 16px; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); padding: 8px 13px; cursor: pointer; font-size: 12px; font-weight: 600; }
      .tab:hover, .tab.active { color: var(--paper); background: var(--ink); border-color: var(--ink); }
      .results-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 26px 0 14px; }
      .results-count { color: var(--muted); font-size: 13px; }
      .results-count strong { color: var(--ink); }
      .data-status { color: var(--muted); font-size: 12px; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-bottom: 72px; }
      .card { min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; animation: rise .35s both; }
      .card:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: 0 12px 28px rgba(17, 17, 17, .08); }
      @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 18px 18px 12px; }
      .identity { min-width: 0; display: flex; align-items: center; gap: 12px; }
      .icon { width: 46px; height: 46px; flex: 0 0 46px; border: 1px solid var(--line); border-radius: 11px; object-fit: cover; background: var(--soft); }
      .preview-carousel { padding: 0 18px 14px; }
      .preview-frame { position: relative; display: grid; place-items: center; overflow: hidden; aspect-ratio: 16 / 9; min-height: 174px; border: 1px solid var(--line); border-radius: 10px; background: #080808; }
      .preview-image { display: block; width: 100%; height: 100%; object-fit: contain; }
      .preview-arrow { position: absolute; top: 50%; display: grid; place-items: center; width: 30px; height: 38px; transform: translateY(-50%); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(8,8,8,.78); color: var(--ink); cursor: pointer; font-size: 22px; line-height: 1; transition: background .16s ease, opacity .16s ease; }
      .preview-arrow:hover { background: rgba(38,38,36,.96); }
      .preview-arrow:disabled { opacity: .35; cursor: default; }
      .preview-arrow.prev { left: 8px; }
      .preview-arrow.next { right: 8px; }
      .preview-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; padding: 8px 2px 0; }
      .preview-dots { display: flex; align-items: center; gap: 6px; }
      .preview-dot { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 999px; background: var(--line-strong); cursor: pointer; transition: width .16s ease, background .16s ease; }
      .preview-dot[aria-current="true"] { width: 20px; background: var(--ink); }
      .preview-count { color: var(--muted); font: 10px "DM Mono", ui-monospace, monospace; }
      .card h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; overflow-wrap: anywhere; }
      .card-id { color: var(--muted); font-size: 11px; margin-top: 3px; overflow-wrap: anywhere; }
      .version { flex: 0 0 auto; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; font-size: 10px; }
      .card-body { padding: 0 18px 17px; flex: 1; }
      .description { min-height: 60px; margin: 8px 0 15px; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
      .meta { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; color: var(--muted); font-size: 10px; }
      .chip b { color: var(--ink); font-weight: 600; }
      .details { margin-top: 13px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 7px; }
      .detail { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 11px; }
      .detail span:last-child { color: var(--ink); text-align: right; overflow-wrap: anywhere; }
      .card-footer { min-height: 58px; display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-top: 1px solid var(--line); background: var(--panel); }
      .action { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; border-radius: 7px; padding: 0 10px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); text-decoration: none; cursor: pointer; font-size: 11px; font-weight: 600; }
      .action:hover { background: var(--soft); }
      .action.install { margin-left: auto; color: var(--paper); background: var(--ink); border-color: var(--ink); }
      .action.install:hover { background: #d7d7d3; }
      .action:disabled { cursor: wait; opacity: .6; }
      .empty, .loading { grid-column: 1 / -1; padding: 72px 20px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); }
      .empty strong { display: block; color: var(--ink); margin-bottom: 5px; }
      footer { border-top: 1px solid var(--line); padding: 22px 0 36px; color: var(--muted); font-size: 12px; }
      .footer-row { display: flex; justify-content: space-between; gap: 20px; }
      .footer-row a { text-underline-offset: 3px; }
      .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(17, 17, 17, .55); opacity: 1; transition: opacity .2s; }
      .modal-backdrop.hidden { display: none; opacity: 0; }
      .modal { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--ink); border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,.2); padding: 22px; }
      .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .modal h2 { margin: 0; font-size: 16px; }
      .modal label { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin: 13px 0 6px; }
      .modal input { width: 100%; height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 11px; outline: none; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
      .toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; max-width: calc(100% - 40px); padding: 11px 14px; background: var(--ink); color: var(--paper); border-radius: 8px; font-size: 12px; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .2s ease; }
      .toast.show { transform: translateY(0); opacity: 1; }
      .toast.error { background: var(--danger); }
      @media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 24px; padding-top: 52px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .search-row { grid-template-columns: 1fr 1fr; } .field:first-child { grid-column: 1 / -1; } }
      @media (max-width: 560px) { .shell { width: min(100% - 28px, 1180px); } .header-row { min-height: 62px; } .brand-sub { font-size: 10px; } h1 { font-size: 3rem; } .grid { grid-template-columns: 1fr; } .search-row { grid-template-columns: 1fr; } .field:first-child { grid-column: auto; } .clear-btn { width: 100%; } .results-bar, .footer-row { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-row">
        <div class="brand"><span>Community Marketplace <span class="brand-sub">(managed by <a class="brand-link" href="https://github.com/Pal-droid" target="_blank" rel="noopener">@Pal-droid</a>)</span></span></div>
        <div class="header-actions"><a class="text-btn" href="https://github.com/Seanime-contributions/Seanime-Providers" target="_blank" rel="noopener">GitHub ↗</a><button class="icon-btn" id="settings-btn" type="button" aria-label="Open settings">⚙</button><div class="menu-wrap"><button class="icon-btn menu-button" id="menu-button" type="button" aria-label="Open menu" aria-expanded="false">☰</button><nav class="site-menu hidden" id="site-menu"><a class="active" href="./">Marketplace</a><a href="./down-detector.html">Extensions down detector</a></nav></div></div>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Marketplace filters">
        <div class="shell">
          <div class="search-row">
            <label class="field"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search name, description, author, version…" autocomplete="off" /></label>
            <label class="field"><select id="author-filter" aria-label="Filter by author"><option value="">All authors</option></select></label>
            <label class="field"><select id="language-filter" aria-label="Filter by language"><option value="">All languages</option></select></label>
            <button class="clear-btn" id="clear-filters" type="button">Clear filters</button>
          </div>
          <nav class="tabs" aria-label="Extension categories"><button class="tab active" data-category="all" type="button">All</button><button class="tab" data-category="plugin" type="button">Plugins</button><button class="tab" data-category="onlinestream-provider" type="button">Online streams</button><button class="tab" data-category="manga-provider" type="button">Manga</button><button class="tab" data-category="anime-torrent-provider" type="button">Torrents</button></nav>
        </div>
      </section>

      <section class="shell results-bar"><div class="results-count"><strong id="result-count">—</strong> extensions shown</div><div class="data-status" id="data-status">Loading manifests…</div></section>
      <section class="shell grid" id="extension-grid" aria-live="polite"><div class="loading">Loading the extension catalog…</div></section>
    </main>

    <footer><div class="shell footer-row"><span>Seanime Marketplace · Community maintained</span></div></footer>

    <div class="toast" id="toast" role="status"></div>
    <div class="modal-backdrop hidden" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal"><div class="modal-head"><h2 id="settings-title">Install settings</h2><button class="icon-btn" id="settings-close" type="button" aria-label="Close settings">×</button></div><p class="hero-copy" style="font-size:13px;margin:0">Choose the Seanime server that should receive installations.</p><label for="setting-uri">Server URI</label><input id="setting-uri" type="text" placeholder="http://localhost" /><label for="setting-port">Server port</label><input id="setting-port" type="text" placeholder="43211" /><div class="modal-actions"><button class="action" id="settings-cancel" type="button">Cancel</button><button class="action install" id="settings-save" type="button">Save settings</button></div></div>
    </div>

    <script>
      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => Array.from(document.querySelectorAll(selector));
      const placeholderDataUrl = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='#1d1d1b'/><path d='M50 34v32M34 50h32' stroke='#494946' stroke-width='3'/></svg>");
      const state = { items: [], category: "all", query: "", author: "", language: "" };
      const previewFiles = [
        "anilist-activities-1.jpg", "anilist-activities-2.png",
        "anime-news-1.png", "anime-news-2.png",
        "character-info-plus-1.jpg", "cookie-clicker-1.png",
        "ln-reader-1.png", "ln-reader-2.png", "ln-reader-3.png",
      ];
      const previewSlugAliases = { "anilist-activity": "anilist-activities", "characters-info-plus": "character-info-plus" };
      const previewsBySlug = previewFiles.reduce((groups, filename) => {
        const match = filename.match(/^(.+)-(\d+)\.([a-z0-9]+)$/i);
        if (!match) return groups;
        const [, slug, order] = match;
        (groups[slug.toLocaleLowerCase()] ||= []).push({ order: Number(order), src: `public/plugins-ss/${filename}` });
        return groups;
      }, {});
      Object.values(previewsBySlug).forEach(previews => previews.sort((a, b) => a.order - b.order));
      const DEFAULT_URI = "http://localhost";
      const DEFAULT_PORT = "43211";

      function settingValues() { return { uri: localStorage.getItem("seanime_uri") || DEFAULT_URI, port: localStorage.getItem("seanime_port") || DEFAULT_PORT }; }
      function installUrl() { const { uri, port } = settingValues(); return `${uri.replace(/\/$/, "")}:${port}/api/v1/extensions/external/install`; }
      function showToast(message, error = false) { const toast = $("#toast"); toast.textContent = message; toast.className = `toast show${error ? " error" : ""}`; clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove("show"), 3200); }
      function copyText(text) { navigator.clipboard?.writeText(text).then(() => showToast("Copied to clipboard")).catch(() => showToast("Copy failed", true)); }
      function valueText(value) { if (value === undefined || value === null || value === "") return "—"; if (Array.isArray(value)) return value.join(", "); if (typeof value === "object") return Object.entries(value).map(([key, val]) => `${key}: ${valueText(val)}`).join(" · "); return String(value); }
      function normalized(value) { return valueText(value).toLocaleLowerCase(); }
      function typeLabel(type) { return ({ plugin: "Plugin", "onlinestream-provider": "Online stream", "manga-provider": "Manga", "anime-torrent-provider": "Torrent" })[type] || type || "Extension"; }
      function categoryMatches(item) { return state.category === "all" || item.type === state.category; }

      async function getManifest(item) {
        if (!item.manifestURI) return {};
        try { const response = await fetch(item.manifestURI); return response.ok ? await response.json() : {}; } catch { return {}; }
      }

      function enrichItem(item, manifest) {
        return { ...item, ...manifest, icon: manifest.icon || item.icon || "", name: item.name || item.id || "Unnamed", author: item.author || "Unknown", language: manifest.language || item.language || "Unknown", contentLanguage: manifest.lang || item.lang || "Unknown", version: manifest.version || item.version || "Unversioned", manifestLoaded: Object.keys(manifest).length > 0 };
      }

      function updateSelect(select, values, label) {
        const previous = select.value;
        select.innerHTML = `<option value="">${label}</option>` + values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
        if (values.includes(previous)) select.value = previous;
      }
      function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]); }

      function currentItems() {
        const query = state.query.trim().toLocaleLowerCase();
        return state.items.filter(item => {
          if (!categoryMatches(item) || (state.author && item.author !== state.author) || (state.language && item.contentLanguage !== state.language)) return false;
          const haystack = [item.name, item.id, item.description, item.author, item.type, item.language, item.contentLanguage, item.version, item.website, item.episodeServers, item.supportsDub].map(normalized).join(" ");
          return !query || haystack.includes(query);
        });
      }

      function metadataRows(item) {
        const rows = [["Author", item.author], ["Language", item.contentLanguage], ["Extension language", item.language], ["Type", typeLabel(item.type)]];
        if (item.supportsDub !== undefined) rows.push(["Dub support", item.supportsDub ? "Yes" : "No"]);
        if (item.episodeServers) rows.push(["Servers", item.episodeServers]);
        if (item.license) rows.push(["License", item.license]);
        if (item.repository) rows.push(["Repository", item.repository]);
        return rows.slice(0, 6);
      }

      function renderPreviewCarousel(item) {
        const slug = String(item.id || "").toLocaleLowerCase();
        const previews = previewsBySlug[previewSlugAliases[slug] || slug];
        if (!previews?.length) return null;

        const carousel = document.createElement("section");
        carousel.className = "preview-carousel";
        carousel.setAttribute("aria-label", `${item.name} screenshot previews`);
        let current = 0;
        const frame = document.createElement("div");
        frame.className = "preview-frame";
        const image = document.createElement("img");
        image.className = "preview-image";
        image.loading = "lazy";
        image.alt = `${item.name} screenshot 1 of ${previews.length}`;
        frame.append(image);

        const footer = document.createElement("div");
        footer.className = "preview-footer";
        const dots = document.createElement("div");
        dots.className = "preview-dots";
        const count = document.createElement("span");
        count.className = "preview-count";
        footer.append(dots, count);

        const buttons = previews.map((preview, index) => {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "preview-dot";
          dot.setAttribute("aria-label", `Show screenshot ${index + 1} of ${previews.length} for ${item.name}`);
          dot.addEventListener("click", () => show(index));
          dots.append(dot);
          return dot;
        });

        const show = (index) => {
          current = (index + previews.length) % previews.length;
          image.src = previews[current].src;
          image.alt = `${item.name} screenshot ${current + 1} of ${previews.length}`;
          count.textContent = `${current + 1} / ${previews.length}`;
          buttons.forEach((button, buttonIndex) => button.setAttribute("aria-current", String(buttonIndex === current)));
        };

        if (previews.length > 1) {
          const previous = document.createElement("button");
          previous.type = "button";
          previous.className = "preview-arrow prev";
          previous.setAttribute("aria-label", `Previous ${item.name} screenshot`);
          previous.textContent = "‹";
          previous.addEventListener("click", () => show(current - 1));
          const next = document.createElement("button");
          next.type = "button";
          next.className = "preview-arrow next";
          next.setAttribute("aria-label", `Next ${item.name} screenshot`);
          next.textContent = "›";
          next.addEventListener("click", () => show(current + 1));
          frame.append(previous, next);
        }
        carousel.append(frame, footer);
        show(0);
        return carousel;
      }

      function renderCard(item, index) {
        const article = document.createElement("article"); article.className = "card"; article.style.animationDelay = `${Math.min(index, 12) * 24}ms`;
        const icon = item.icon || placeholderDataUrl;
        const rows = metadataRows(item).map(([key, value]) => `<div class="detail"><span>${escapeHtml(key)}</span><span>${escapeHtml(valueText(value))}</span></div>`).join("");
        article.innerHTML = `<div class="card-top"><div class="identity"><img class="icon" src="${escapeHtml(icon)}" alt="" loading="lazy" /><div><h2>${escapeHtml(item.name)}</h2><div class="card-id mono">${escapeHtml(item.id || "")}</div></div></div><span class="version mono">v${escapeHtml(valueText(item.version).replace(/^v/i, ""))}</span></div><div class="card-body"><p class="description">${escapeHtml(item.description || "No description available.")}</p><div class="meta"><span class="chip"><b>${escapeHtml(typeLabel(item.type))}</b></span><span class="chip">${escapeHtml(item.contentLanguage)}</span><span class="chip">${escapeHtml(item.language)}</span>${item.manifestLoaded ? '<span class="chip">manifest ✓</span>' : '<span class="chip">catalog data</span>'}</div><div class="details">${rows}</div></div><div class="card-footer"><a class="action" href="${escapeHtml(item.manifestURI || "#")}" target="_blank" rel="noopener">Manifest ↗</a>${item.website ? `<a class="action" href="${escapeHtml(item.website)}" target="_blank" rel="noopener">Website ↗</a>` : ""}<button class="action install" type="button">Install</button></div>`;
        const previewCarousel = renderPreviewCarousel(item);
        if (previewCarousel) article.insertBefore(previewCarousel, article.querySelector(".card-body"));
        const image = article.querySelector("img"); image.addEventListener("error", () => { image.src = placeholderDataUrl; });
        article.querySelector(".install").addEventListener("click", () => installExtension(item, article.querySelector(".install")));
        return article;
      }

      function render() {
        const grid = $("#extension-grid"); const items = currentItems(); grid.innerHTML = "";
        $("#result-count").textContent = items.length;
        if (!items.length) { grid.innerHTML = `<div class="empty"><strong>No extensions match those filters.</strong>Try clearing a filter or searching for another term.</div>`; return; }
        items.forEach((item, index) => grid.appendChild(renderCard(item, index)));
      }

      async function installExtension(item, button) {
        const original = button.textContent; button.disabled = true; button.textContent = "Installing…";
        try { const response = await fetch(installUrl(), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ manifestUri: item.manifestURI }) }); const result = await response.json().catch(() => ({})); if (!response.ok || result.success === false) throw new Error("Install failed"); button.textContent = "Installed"; showToast(`${item.name} installed`); }
        catch (error) { console.error(error); button.disabled = false; button.textContent = original; showToast("Could not install extension", true); }
      }

      async function loadCatalog() {
        try {
          const response = await fetch("marketplace/main.json"); if (!response.ok) throw new Error("Catalog unavailable");
          const catalog = await response.json(); const rawItems = Array.isArray(catalog) ? catalog : Object.values(catalog).flat().filter(value => value && typeof value === "object");
          $("#data-status").textContent = `Loading ${rawItems.length} manifests…`;
          state.items = await Promise.all(rawItems.map(async item => enrichItem(item, await getManifest(item))));
          const authors = [...new Set(state.items.map(item => item.author).filter(Boolean))].sort((a, b) => a.localeCompare(b));
          const languages = [...new Set(state.items.map(item => item.contentLanguage).filter(Boolean))].sort((a, b) => a.localeCompare(b));
          updateSelect($("#author-filter"), authors, "All authors"); updateSelect($("#language-filter"), languages, "All languages");
          $("#data-status").textContent = `${state.items.length} extensions · ${state.items.filter(item => item.manifestLoaded).length} manifests parsed`;
          render();
        } catch (error) { console.error(error); $("#data-status").textContent = "Could not load marketplace/main.json"; $("#extension-grid").innerHTML = `<div class="empty"><strong>Could not load the catalog.</strong>Try refreshing the page.</div>`; }
      }

      function resetFilters() { state.query = ""; state.author = ""; state.language = ""; $("#search").value = ""; $("#author-filter").value = ""; $("#language-filter").value = ""; render(); }
      function openSettings() { const values = settingValues(); $("#setting-uri").value = values.uri; $("#setting-port").value = values.port; $("#settings-modal").classList.remove("hidden"); $("#setting-uri").focus(); }
      function closeSettings() { $("#settings-modal").classList.add("hidden"); }
      const menuButton = $("#menu-button");
      const menu = $("#site-menu");
      menuButton.addEventListener("click", () => { const hidden = menu.classList.toggle("hidden"); menuButton.setAttribute("aria-expanded", String(!hidden)); });
      document.addEventListener("click", event => { if (!event.target.closest(".menu-wrap")) { menu.classList.add("hidden"); menuButton.setAttribute("aria-expanded", "false"); } });

      window.addEventListener("DOMContentLoaded", () => {
        $$(".tab").forEach(button => button.addEventListener("click", () => { $$(".tab").forEach(tab => tab.classList.remove("active")); button.classList.add("active"); state.category = button.dataset.category; render(); }));
        $("#search").addEventListener("input", event => { state.query = event.target.value; render(); });
        $("#author-filter").addEventListener("change", event => { state.author = event.target.value; render(); });
        $("#language-filter").addEventListener("change", event => { state.language = event.target.value; render(); });
        $("#clear-filters").addEventListener("click", resetFilters);
        $("#settings-btn").addEventListener("click", openSettings); $("#settings-close").addEventListener("click", closeSettings); $("#settings-cancel").addEventListener("click", closeSettings);
        $("#settings-save").addEventListener("click", () => { localStorage.setItem("seanime_uri", $("#setting-uri").value.trim() || DEFAULT_URI); localStorage.setItem("seanime_port", $("#setting-port").value.trim() || DEFAULT_PORT); closeSettings(); showToast("Install settings saved"); });
        $("#settings-modal").addEventListener("click", event => { if (event.target.id === "settings-modal") closeSettings(); });
        document.addEventListener("keydown", event => { if (event.key === "Escape") closeSettings(); });
        loadCatalog();
      });
    </script>
  </body>
</html>
